<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formador de Times</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f7f7f7;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 2.5em;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .teams {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .team {
            width: 45%;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .team h2 {
            color: #555;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 1.2em;
            background-color: #fafafa;
            color: #333;
        }
        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            background-color: #ff6b6b;
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff4d4d;
        }
        #resultado {
            margin-top: 30px;
            font-weight: bold;
            white-space: pre-line;
            font-size: 1.5em;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 30px auto;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        th {
            background-color: #ff6b6b;
            color: white;
            font-size: 1.2em;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <h1>Formador de Times</h1>
    <div class="teams">
        <div class="team">
            <h2>Time 1</h2>
            <input type="text" id="jogadores1" placeholder="Digite os nomes separados por vírgula">
        </div>
        <div class="team">
            <h2>Time 2</h2>
            <input type="text" id="jogadores2" placeholder="Digite os nomes separados por vírgula">
        </div>
    </div>
    <br>
    <button onclick="formarTimes()">Formar Times</button>
    <div id="resultado"></div>

    <script>
        function formarTimes() {
            let jogadores1 = document.getElementById("jogadores1").value.split(",").map(j => j.trim()).filter(j => j);
            let jogadores2 = document.getElementById("jogadores2").value.split(",").map(j => j.trim()).filter(j => j);
            
            if (jogadores1.length === 0 || jogadores2.length === 0) {
                alert("Ambos os times precisam ter pelo menos um jogador.");
                return;
            }
            
            let resultadoHTML = `
                <h2>Resultado:</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Jogadores</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Time 1</strong></td>
                            <td>${jogadores1.join(", ")}</td>
                        </tr>
                        <tr>
                            <td><strong>Time 2</strong></td>
                            <td>${jogadores2.join(", ")}</td>
                        </tr>
                    </tbody>
                </table>
            `;
            document.getElementById("resultado").innerHTML = resultadoHTML;
        }
    </script>
</body>
</html>
